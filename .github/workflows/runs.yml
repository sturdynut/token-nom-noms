name: runs

on:
  pull_request:
    paths: ["runs/**", "nomnom/**", "tests/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["runs/**", "nomnom/**", "tests/**", ".github/workflows/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate every run folder
        run: python3 -m nomnom validate
      - name: The replay page still builds
        run: |
          python3 -m nomnom leaderboard
          python3 -m nomnom html $(ls -d runs/*/) -o /tmp/index.html
          test -s /tmp/index.html

  rebuild:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild leaderboard and replay page
        run: |
          python3 -m nomnom leaderboard
          python3 -m nomnom html $(ls -d runs/*/) -o docs/index.html
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runs/README.md docs/index.html
          git diff --cached --quiet || git commit -m "Rebuild leaderboard and replay page"
          git push
